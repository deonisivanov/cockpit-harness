packages:
  - apps/*
  - packages/*
  # A cartridge is a project that depends on the kit, so the fixture is one too: that is what
  # proves the published types compile outside this repo's own build.
  - packages/core/test/fixtures/sample-cartridge
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  msgpackr-extract: false
# pnpm 11 defaults minimumReleaseAge to 1440 minutes even with none configured here; this exclusion is load-bearing, not dead.
minimumReleaseAgeExclude:
  - '@types/node@26.2.0'
